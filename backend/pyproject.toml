[project]
name = "backend"
version = "0.1.0"
description = "FastAPI 백엔드 + 모델 추론"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pyyaml",
    "ai-core",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
]

[tool.uv.sources]
ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
