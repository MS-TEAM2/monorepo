openapi: 3.1.0
info:
  title: AX Service API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/db:
    get:
      tags:
      - system
      summary: Health Db
      operationId: health_db_health_db_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/predict:
    post:
      tags:
      - ai
      summary: Run Predict
      operationId: run_predict_api_v1_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/token:
    post:
      tags:
      - auth
      summary: 1회용 코드를 세션 토큰으로 교환 (A01)
      operationId: issue_token_api_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/{provider}/start:
    get:
      tags:
      - auth
      summary: 소셜 로그인 시작 (A26)
      description: 브라우저가 직접 여는 주소다. 성공하면 공급자 로그인 화면으로 이동한다. `client`가 올바르면 입력 오류도
        JSON 대신 돌아갈 주소의 `error=terms_outdated` 또는 `error=invalid_request`로 302 이동한다.
        `client`가 잘못되면 422, 지원하지 않는 공급자는 404다.
      operationId: start_login_api_v1_auth__provider__start_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - kakao
          title: Provider
      - name: client
        in: query
        required: true
        schema:
          enum:
          - web
          - app
          type: string
          title: Client
      - name: code_challenge
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 필수. S256, base64url 43자
          title: Code Challenge
        description: 필수. S256, base64url 43자
      - name: terms_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 필수. 동의한 약관 버전
          title: Terms Version
        description: 필수. 동의한 약관 버전
      responses:
        '302':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/auth/{provider}/callback:
    get:
      tags:
      - auth
      summary: 소셜 로그인 콜백 (A27)
      description: 공급자가 부른다. 성공하면 1회용 `code`를, 실패하면 `error`(`cancelled`, `provider_error`,
        `expired`, `account_deleting`)를 쿼리에 붙여 돌아갈 주소로 302 이동한다.
      operationId: finish_login_api_v1_auth__provider__callback_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - kakao
          title: Provider
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 공급자가 준 인가 코드
          title: Code
        description: 공급자가 준 인가 코드
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 공급자가 알려 준 오류
          title: Error
        description: 공급자가 알려 준 오류
      responses:
        '302':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃 (A29)
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: 내 정보 (A28)
      operationId: get_me_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - users
      summary: 회원 탈퇴 (A30)
      operationId: delete_me_api_v1_users_me_delete
      responses:
        '204':
          description: Successful Response
        '202':
          description: 삭제가 남아 정리 작업이 이어서 한다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/categories:
    get:
      tags:
      - explore
      summary: 업종 목록 (A03)
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/regions/resolve:
    get:
      tags:
      - explore
      summary: 좌표의 행정동 판정 (A04)
      description: '서울 밖이면 200과 `supported: false`이고 나머지 값은 null이다.'
      operationId: resolve_region_api_v1_regions_resolve_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: 중심 위도 (WGS84)
          title: Lat
        description: 중심 위도 (WGS84)
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: 중심 경도 (WGS84)
          title: Lng
        description: 중심 경도 (WGS84)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionResolveResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/stores:
    get:
      tags:
      - explore
      summary: 주변 매장 조회 (A05)
      description: 영업 중이고 업종이 매핑됐으며 좌표가 있는 매장만 가까운 순(같으면 ID 순)으로 준다. 중심이 서울 밖이면 400
        `out_of_service_area`, 결과가 없으면 200과 빈 배열이다.
      operationId: list_stores_api_v1_stores_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: 중심 위도 (WGS84)
          title: Lat
        description: 중심 위도 (WGS84)
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: 중심 경도 (WGS84)
          title: Lng
        description: 중심 경도 (WGS84)
      - name: radius
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Radius'
          description: 반경(m)
          default: 500
        description: 반경(m)
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 업종 ID. 여러 번 보낸다. 없으면 외식 9종 전체
          title: Category
        description: 업종 ID. 여러 번 보낸다. 없으면 외식 9종 전체
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: 이 API만 기본·최대 1000
          default: 1000
          title: Limit
        description: 이 API만 기본·최대 1000
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/areas/summary:
    get:
      tags:
      - explore
      summary: 상권 요약 (A07)
      description: 인증 선택. 로그인하지 않으면 `dong_stats`는 null, `locked`는 `["dong_stats"]`이고
        `missing`에는 넣지 않는다. 로그인하면 `locked`는 빈 배열이다. 형식이 잘못된 토큰은 401, 중심이 서울 밖이면 400
        `out_of_service_area`다. 개업·폐업 수가 5건 미만이면 정확한 값을 주지 않는다.
      operationId: get_area_summary_api_v1_areas_summary_get
      security:
      - HTTPBearer: []
      - {}
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: 중심 위도 (WGS84)
          title: Lat
        description: 중심 위도 (WGS84)
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: 중심 경도 (WGS84)
          title: Lng
        description: 중심 경도 (WGS84)
      - name: category
        in: query
        required: true
        schema:
          type: string
          description: 업종 ID 1개
          title: Category
        description: 업종 ID 1개
      - name: radius
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Radius'
          description: 반경(m)
          default: 500
        description: 반경(m)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaSummaryResponse'
              examples:
                logged_in:
                  summary: 로그인 후
                  value:
                    region:
                      dong_code: '11110515'
                      dong_name: 청운효자동
                      gu_name: 종로구
                    radius_stats:
                      radius_m: 500
                      same_category_count: 24
                      opened_1y:
                        status: exact
                        count: 6
                        display: '6'
                      closed_1y:
                        status: masked
                        display: 5건 미만
                      base_date: '2026-11-22'
                    dong_stats:
                      source_regions:
                      - code: '11110515'
                        name: 청운효자동
                      relation: same
                      quarter: '20262'
                      population_quarter: '20262'
                      population_reference_only: false
                      floating_population: 100000
                      population_by_time:
                        '11_14': 18000
                      population_by_age:
                        '30': 20000
                      population_per_store: 420
                      sales_unit_verified: false
                      open_rate: 0.04
                      close_rate: 0.03
                      franchise_ratio: 0.2
                    missing:
                    - avg_sales_per_store
                    locked: []
                logged_out:
                  summary: '로그인 전: 반경 지표만 준다'
                  value:
                    region:
                      dong_code: '11110515'
                      dong_name: 청운효자동
                      gu_name: 종로구
                    radius_stats:
                      radius_m: 500
                      same_category_count: 24
                      opened_1y:
                        status: exact
                        count: 6
                        display: '6'
                      closed_1y:
                        status: masked
                        display: 5건 미만
                      base_date: '2026-11-22'
                    missing: []
                    locked:
                    - dong_stats
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/diagnoses:
    post:
      tags:
      - diagnoses
      summary: 진단 생성 (A09)
      description: 행정동은 서버가 좌표로 판정한다. 서울 밖이면 400 `out_of_service_area`다.
      operationId: create_diagnosis_api_v1_diagnoses_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisDetailResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
    get:
      tags:
      - diagnoses
      summary: 진단 목록 (A10)
      description: '`created_at` 내림차순, 같으면 `id` 내림차순. 잘못된 커서는 422다.'
      operationId: list_diagnoses_api_v1_diagnoses_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 이전 응답의 `next_cursor`
          title: Cursor
        description: 이전 응답의 `next_cursor`
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisListResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/diagnoses/{diagnosis_id}:
    get:
      tags:
      - diagnoses
      summary: 진단 상세 (A11)
      description: 다른 사용자의 진단이나 삭제 요청했거나 만료된 진단은 404다.
      operationId: get_diagnosis_api_v1_diagnoses__diagnosis_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: diagnosis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Diagnosis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisDetailResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/contracts:
    post:
      tags:
      - contracts
      summary: 계약서 업로드 (A15)
      description: 파일 확장자가 아니라 실제 형식을 검사하고 이미지 1장은 1쪽으로 센다. 크기 초과는 413 `file_too_large`,
        형식 오류는 415 `unsupported_file`이다. 10쪽 초과는 422 `too_many_pages`, 암호 PDF는 422
        `encrypted_file`, 동의가 없거나 허용하지 않는 동의 버전은 422 `consent_required`다. `diagnosis_id`를
        보내면 만든 계약을 그 진단에 연결한다. 다른 사용자의 진단, 만료·삭제 요청한 진단이면 404다. 사용자당 처리 중인 계약은 1개이며,
        이미 있으면 409 `contract_processing`이다. 실패·확인한 계약이 있어도 새로 올릴 수 있다.
      operationId: create_contract_api_v1_contracts_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                files:
                  items:
                    type: string
                    format: binary
                  type: array
                  minItems: 1
                  description: JPG·PNG·PDF, 파일당 10MB, 합계 20MB, 최대 10쪽. 여러 번 보내며 보낸
                    순서가 쪽 순서다
                consent_version:
                  type: string
                  description: 동의한 문구 버전
                consented:
                  type: boolean
                  description: true여야 한다
                diagnosis_id:
                  type: string
                  format: uuid
                  description: 선택. 진단 결과에서 올리면 그 진단 ID. 없으면 진단 연결 없이 만든다
              type: object
              required:
              - files
              - consent_version
              - consented
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractAcceptedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/contracts/{contract_id}:
    get:
      tags:
      - contracts
      summary: 계약서 분석 상태와 결과 (A16)
      description: 처리 중에는 2초 간격으로 조회하고 오래 걸리면 간격을 늘린다. 다른 사용자의 계약과 취소 중인 계약은 404다.
      operationId: get_contract_api_v1_contracts__contract_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Contract Id
      responses:
