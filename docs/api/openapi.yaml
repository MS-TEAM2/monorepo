openapi: 3.1.0
info:
  title: AX Service API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/db:
    get:
      tags:
      - system
      summary: Health Db
      operationId: health_db_health_db_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/predict:
    post:
      tags:
      - ai
      summary: Run Predict
      operationId: run_predict_api_v1_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DbHealthResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - ok
      type: object
      required:
      - status
      title: DbHealthResponse
    ErrorResponse:
      properties:
        detail:
          anyOf:
          - type: string
          - items:
              additionalProperties: true
              type: object
            type: array
          title: Detail
        code:
          type: string
          title: Code
      type: object
      required:
      - detail
      - code
      title: ErrorResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - ok
        model_loaded:
          type: boolean
          title: Model Loaded
      type: object
      required:
      - status
      - model_loaded
      title: HealthResponse
    PredictRequest:
      properties:
        features:
          items:
            items:
              type: number
            type: array
          type: array
          minItems: 1
          title: Features
          description: 행 단위 피처 배열
          examples:
          - - - 5.1
              - 3.5
              - 1.4
              - 0.2
      type: object
      required:
      - features
      title: PredictRequest
    PredictResponse:
      properties:
        predictions:
          items:
            type: integer
          type: array
          title: Predictions
      type: object
      required:
      - predictions
      title: PredictResponse
