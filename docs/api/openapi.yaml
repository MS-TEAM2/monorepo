                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/contracts/{contract_id}/terms:
    patch:
      tags:
      - contracts
      summary: 계약 조건 확인·수정 (A17)
      description: 조건 키에 맞지 않는 값은 422 `invalid_term`이다. `start_date`는 `end_date`보다
        빨라야 하고 월세는 1 이상이다. `complete`가 true면 `monthly_rent`, `start_date`, `end_date`
        확인이 필수이며 빠지면 422 `terms_incomplete`다. 오류가 있으면 아무것도 저장하지 않는다. true면 confirmed,
        false면 needs_review가 된다. confirmed 상태에서 부르면 그 계약으로 만든 계산을 지우고 `application`은
        null이 된다. 처리 중이면 409 `contract_processing`, 실패한 계약이면 409 `contract_failed`다.
      operationId: update_terms_api_v1_contracts__contract_id__terms_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Contract Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
