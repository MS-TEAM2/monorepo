name: changed
description: PR에서 바뀐 파일이 주어진 정규식과 맞는지 알려 준다. 워크플로 트리거에 paths 필터를 쓰면 필수 체크가 영원히 대기 상태가 되므로, 워크플로는 항상 실행하고 여기서 걸러 낸다.
inputs:
  pattern:
    description: 바뀐 파일 경로에 적용할 grep -E 정규식
    required: true
outputs:
  hit:
    description: 맞는 파일이 있으면 true
    value: ${{ steps.diff.outputs.hit }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        PATTERN: ${{ inputs.pattern }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "$PATTERN"; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi
