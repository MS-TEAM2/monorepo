name: pr-check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-check:
    # Dependabot PR은 Jira 키가 없으므로 건너뛴다
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 이름과 PR 제목에 Jira 키가 있는지 검사
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          key='[A-Z][A-Z0-9]+-[0-9]+'
          failed=0
          if [[ ! "$BRANCH" =~ ^($types)/$key-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::브랜치 이름이 규칙과 다릅니다: '$BRANCH' (예: feat/SCRUM-12-login)"
            failed=1
          fi
          if [[ ! "$TITLE" =~ ^\[$key\]\ .+ ]]; then
            echo "::error::PR 제목이 규칙과 다릅니다: '$TITLE' (예: [SCRUM-12] 로그인 API)"
            failed=1
          fi
          exit $failed
