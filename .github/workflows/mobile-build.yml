name: mobile-build

# 수동 실행: EAS Build 로 앱을 빌드한다 (네이티브 부분이 바뀌었을 때만).
# 화면(웹) 변경은 앱 빌드 없이 웹 배포만으로 앱에 반영된다.
# 무료 플랜은 월 빌드 횟수에 제한이 있으므로 꼭 필요할 때만 돌린다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json 의 빌드 프로필
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: 빌드할 플랫폼
        type: choice
        options: [android, ios, all]
        default: android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS 빌드 요청 (완료를 기다리지 않음, 진행 상황은 expo.dev 에서 확인)
        working-directory: mobile
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait
