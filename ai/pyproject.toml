[project]
name = "ai-core"
version = "0.1.0"
description = "학습·평가·추론 패키지. 백엔드가 이 패키지를 import 해서 모델을 서빙한다."
requires-python = ">=3.13"
dependencies = ["scikit-learn", "joblib", "numpy", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]
